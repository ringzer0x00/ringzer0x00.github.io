---
layout: default
---

<div class="page">
  <div class="two-column-layout">

    <div class="image-column">
      <img
        src="{{ page.image | relative_url }}"
        alt="{{ page.image_alt | default: page.title }}"
      >
    </div>

    <div class="text-column">
      <h1 class="page-title">{{ page.title }}</h1>
      {{ content }}
    </div>

  </div>
</div>

<style>
.two-column-layout {
  display: grid;
  grid-template-columns: 35% 65%;
  gap: 40px;
  align-items: start;
}

.image-column {
  position: sticky;
  top: 20px;
}

.image-column img {
  display: block;
  width: 100%;
  height: auto;
}

.text-column {
  min-width: 0;
}

@media (max-width: 700px) {
  .two-column-layout {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .image-column {
    position: static;
  }
}
</style>
